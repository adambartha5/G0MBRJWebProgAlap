<!DOCTYPE html>

<html lang="hu">

<head>
    <meta charset="UTF-8">

    <title>Megjelenítési tulajdonság</title>

    <style>
        body{
            font-family: 'Times New Roman', serif;
            margin: 20px
        }
        h1{
            font-size: 2.5em;
            font-weight: bold;
        }
        b{
            font-size: 1.5em;
        }

        .BA2, .BA3, .BA4, .BA5{
            background: #66c87a;
            padding: 10px;
            margin-bottom: 10px;
            min-width: 250px;
            max-width: 70vw;
        }

        .BA1 .item{
            display: none;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            min-width: 250px;
            max-width: 50vw;
        }

        .BA2 .item{
            display: inline;
        }

        .BA3 .item{
            display: block;
        }

        .BA4 .item{
            display: inline-block;
        }
        .BA5 .item{
            display: flex;
        }
        .item{
            background: #7d5bbf;
            color: #222;
            padding: 5px 15px;
            margin-right: 5px;
            margin-bottom: 5px;
            border-radius: 2px;
            font-size: 1em;
        }
    </style>
</head>

<body>
    <h1>Megjelenítési tulajdonság</h1>

    <b>display: none</b>
    <div class="BA1">
        <span class="item">PTI BSC 1</span>
        <span class="item">PTI BSC 2</span>
        <span class="item">PTI BSC 3</span>
    </div>

    <b>display: inline</b>
    <div class="BA2">
        <span class="item">PTI BSC 1</span>
        <span class="item">PTI BSC 2</span>
        <span class="item">PTI BSC 3</span>
    </div>

    <b>display: block</b>
    <div class="BA3">
        <span class="item">PTI BSC 1</span>
        <span class="item">PTI BSC 2</span>
        <span class="item">PTI BSC 3</span> 
    </div>

    <b>display: inline-block</b>
    <div class="BA4">
        <span class="item">PTI BSC 1</span>
        <span class="item">PTI BSC 2</span>
        <span class="item">PTI BSC 3</span>
    </div>

    <b>display: flex</b>
    <div class="BA5">
        <span class="item">PTI BSC 1</span>
        <span class="item">PTI BSC 2</span>
        <span class="item">PTI BSC 3</span>
    </div>
</body>

</html>
